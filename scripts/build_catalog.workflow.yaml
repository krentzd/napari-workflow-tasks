name: Build Fractal task catalog

# Like the Fractal task page (fractal-analytics-platform.github.io), but with
# every version of every task package. The result is published on the
# `catalog` branch and read by the napari plugin from
# https://raw.githubusercontent.com/<owner>/<repo>/catalog/index.json,
# so the plugin needs no GitHub API calls.

on:
  schedule:
    - cron: "41 3 * * *"  # daily
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_catalog.py"
      - "src/napari_workflow_tasks/catalog.py"
      - ".github/workflows/build_catalog.yaml"

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install packaging

      # Start from the previous catalog: manifests of released versions never
      # change, so only new versions are fetched
      - name: Check out previous catalog
        run: |
          if git ls-remote --exit-code --heads origin catalog; then
            git fetch --depth 1 origin catalog
            git worktree add catalog-out FETCH_HEAD
          else
            git worktree add --detach catalog-out
            cd catalog-out
            git checkout --orphan catalog
            git rm -rf --quiet .
          fi

      - name: Build catalog
        env:
          # Authenticated GitHub API calls (higher rate limit)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/build_catalog.py --out catalog-out

      - name: Publish to the catalog branch
        working-directory: catalog-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit --quiet -m "Update task catalog"
          git push origin HEAD:catalog
